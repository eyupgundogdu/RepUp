<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(
          title='RepUp – Personalised strength-training planner and workout logger',
          description='RepUp builds a strength-training programme around your goal, schedule and equipment, then helps you log every set and progress week by week.',
          content=~{::main})}">
<body>
<main class="mx-auto max-w-5xl px-4 py-16 sm:py-24">
    <h1 class="max-w-2xl text-4xl font-extrabold tracking-tight sm:text-5xl">Train with a plan. Log every set. Get stronger.</h1>
    <p class="mt-4 max-w-xl text-lg text-muted">RepUp builds a strength programme around your goal, schedule and equipment, then suggests the weight for your next set. Coming soon.</p>

    <section class="mt-12 rounded-2xl border border-border bg-surface p-6" aria-labelledby="tokens-heading">
        <h2 id="tokens-heading" class="text-lg font-semibold">Design tokens preview</h2>
        <a href="#" class="mt-4 inline-flex min-h-11 items-center rounded-xl bg-accent px-5 font-semibold text-on-accent no-underline hover:bg-accent-hover hover:no-underline">Primary button</a>
        <p class="mt-4 rounded-lg bg-accent-soft px-3 py-2">Completed set row</p>
    </section>
</main>
</body>
</html>
